id: physics-start
title: 物理启程
subject: physics
tier: basic
description: >
  物理方向的地基线:先跟物理学家 Brian Cox 的《宇宙的奇迹》,不用一个公式,
  从时间、物质、引力到光,建立起对世界的物理直觉与好奇;等有了微积分,
  再进 Walter Lewin 的经典力学正课,把直觉变成能算的物理。
stages:
  - title: 第一章 · 建立物理直觉
    courses: [wonders-of-the-universe]
  - title: 第二章 · 经典力学正课
    courses: [mit-8-01]

id: mit-6-5940
title: TinyML 与高效深度学习计算
code: "6.5940"
institution: 麻省理工学院
subject: ai
level: advanced
instructor: 韩松 (Song Han)
tags: [ 模型压缩, 量化, 剪枝, 推理加速 ]
prerequisites: [ d2l ]
estimatedHours: 80
description: >
  韩松教授主讲的模型效率专题课，系统讲解剪枝、量化、知识蒸馏、神经架构搜索， 以及大模型推理加速、长上下文优化、分布式与端侧训练等前沿话题。 课程配套实验可以把模型真正部署到微控制器上跑起来，是"让模型变小变快"方向最权威的公开课。

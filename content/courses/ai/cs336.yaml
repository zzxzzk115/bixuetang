id: cs336
title: 从零构建大语言模型
code: "CS336"
institution: 斯坦福大学
subject: ai
level: advanced
tags: [ 大语言模型, Transformer, 分布式训练, 系统优化 ]
prerequisites: [ d2l ]
estimatedHours: 120
description: >
  斯坦福 CS336 带你从最底层的分词器、Transformer 实现一路造到完整的大语言模型： 数据清洗、混合精度训练、并行策略、推理加速、对齐与强化学习全都自己动手写一遍。 课程强调"不许调库"，是目前少有的能把 LLM 从算法到系统讲透的公开课。

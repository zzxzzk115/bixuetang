id: ai-agents
title: 大模型智能体：LLM Agents 公开课
code: "CS294-196"
institution: UC Berkeley
subject: ai
level: advanced
tags: [ LLM, Agent, 大模型应用, 前沿 ]
prerequisites: [ cs336 ]
estimatedHours: 40
description: >
  伯克利面向公众开放的大模型智能体课程，由 Dawn Song 与 Xinyun Chen 主持， 每周邀请工业界与学术界一线研究者讲解推理与规划、工具调用、代码生成智能体、 多智能体协作与安全对齐。适合已经理解 Transformer 与大模型训练流程的学习者， 用来把"会训模型"升级为"会造能干活的智能体"。

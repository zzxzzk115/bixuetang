id: mit-6-874
title: MIT 6.874 计算生物学中的深度学习
code: "6.874"
institution: MIT
subject: ai
level: advanced
tags: [ 深度学习, 计算生物学, 基因组学, 生物信息 ]
prerequisites: [ d2l ]
estimatedHours: 60
description: >
  MIT 由 Manolis Kellis 主讲的研究生课程，把深度学习方法系统地应用到生命科学问题上： 基因调控、蛋白质结构、单细胞组学、药物发现与疾病机理。 课程既讲 CNN/RNN/Transformer/图网络等模型，也讲这些模型在真实生物数据上的建模取舍， 是「AI for Science」方向少见的、由领域专家亲自讲授的高质量课程。

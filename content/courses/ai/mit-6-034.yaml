institution: MIT
subject: ai
level: intermediate
tags: [ 人工智能, 搜索算法, 机器学习, 知识表示 ]
prerequisites: [ cs61a ]
estimatedHours: 60
description: >
  MIT 经典的人工智能导论课，由已故教授 Patrick Winston 主讲。 内容覆盖搜索与博弈、约束满足、规则系统与知识表示、机器学习（近邻、决策树、神经网络、SVM、Boosting）等， 是理解「符号主义 AI」与「统计学习」两条脉络如何交汇的最佳入口。Winston 的板书与讲故事式讲法极具感染力。

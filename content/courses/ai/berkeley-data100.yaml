id: berkeley-data100
title: 数据科学的原理与技术
code: "DATA 100"
institution: UC Berkeley
subject: ai
level: intermediate
tags: [ 数据科学, pandas, 数据可视化, 建模 ]
prerequisites: [ andrew-ng-ml ]
estimatedHours: 100
description: >
  伯克利数据科学的中坚课程，串起数据获取与清洗、探索性分析与可视化、 SQL 与 pandas 实操，再到线性/逻辑回归、特征工程、交叉验证与偏差方差权衡。 强调「从真实脏数据出发做出可信结论」，作业与项目全部基于 Jupyter， 是把机器学习理论落到工程实践的最佳桥梁课。

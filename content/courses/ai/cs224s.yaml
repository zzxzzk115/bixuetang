id: cs224s
title: 斯坦福 CS224S 口语语言处理与语音识别
code: "CS224S"
institution: 斯坦福大学
subject: ai
level: advanced
tags: [ 语音识别, 语音合成, 对话系统, 深度学习 ]
prerequisites: [ cs224n ]
estimatedHours: 60
description: >
  斯坦福大学面向语音方向的进阶课程，系统讲解自动语音识别（ASR）、语音合成（TTS） 与口语对话系统的建模方法，从声学特征、HMM 时代一路讲到端到端神经网络与大规模 自监督语音表征。课程与 CS224N 互补，把 NLP 的能力延伸到真实的声音信号上， 适合想做语音助手、语音大模型或多模态交互的人。

subject: ai
level: advanced
instructor: Jure Leskovec
tags: [ 数据挖掘, 大数据, MapReduce, 推荐系统 ]
prerequisites: [ andrew-ng-ml ]
estimatedHours: 90
description: >
  斯坦福 CS246 由图挖掘权威 Jure Leskovec 主讲，聚焦「数据大到放不进内存」时的算法设计： MapReduce、局部敏感哈希、频繁项集、流式算法、PageRank、推荐系统与大规模聚类。 配套教材《Mining of Massive Datasets》免费开放，是把机器学习推向工业规模的必修课。

prerequisites: [ mit-18-06 ]
estimatedHours: 90
description: >
  MIT 面向本科生的机器学习入门课（原 6.036，现编号 6.390），从线性分类器、 感知机、正则化一路讲到神经网络、卷积网络、序列模型、马尔可夫决策过程与强化学习。 特色是数学推导扎实但不失直观，配套讲义与自动评测的编程练习，非常适合作为 线性代数之后进入机器学习的第一门系统课程。

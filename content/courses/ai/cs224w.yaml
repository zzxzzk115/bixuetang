id: cs224w
title: 图机器学习
code: "CS224W"
institution: 斯坦福大学
subject: ai
level: advanced
tags: [ 图神经网络, 表示学习, 知识图谱, 深度学习 ]
prerequisites: [ d2l ]
estimatedHours: 70
description: >
  斯坦福 Jure Leskovec 主讲的图机器学习课程，从图论与网络性质讲起， 一路推进到节点嵌入、GNN、消息传递、图生成模型与知识图谱推理。 它是理解 GraphSAGE、GAT、PyG 等现代图学习工具的权威入口， 配套 Colab 作业可直接上手真实图数据。

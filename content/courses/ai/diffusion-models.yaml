id: diffusion-models
title: 扩散模型原理与实践
code: "Diffusion Models"
institution: 台湾大学（李宏毅）
subject: ai
level: advanced
tags: [ 扩散模型, 生成模型, 图像生成, 深度学习 ]
prerequisites: [ d2l ]
estimatedHours: 30
description: >
  从零讲清扩散模型（DDPM / DDIM / Stable Diffusion）的数学原理与工程实现： 前向加噪与反向去噪过程、变分下界推导、条件生成与 classifier-free guidance， 以及文本到图像模型的整体架构。李宏毅老师的中文讲授把复杂推导拆得非常直观， 是中文世界入门生成式视觉模型的首选材料。

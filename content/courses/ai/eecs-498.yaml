subject: ai
level: advanced
tags: [ 计算机视觉, 深度学习, 神经网络, pytorch ]
prerequisites: [ d2l ]
estimatedHours: 80
description: >
  CS231n 原助教 Justin Johnson 在密歇根大学开设的深度学习视觉课，可视作 CS231n 的加强重制版。 从线性分类器、反向传播一路讲到 CNN、注意力机制、Transformer、生成模型与 3D 视觉， 作业全部用 PyTorch 从零手写，是补齐视觉方向工程能力的最佳课程之一。

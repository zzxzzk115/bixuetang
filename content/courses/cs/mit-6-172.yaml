id: mit-6-172
title: 软件性能工程
code: "6.172"
institution: MIT
subject: cs
level: advanced
tags: [ 性能优化, 并行计算, 编译器, C语言 ]
prerequisites: [ csapp ]
estimatedHours: 120
description: >
  MIT 面向高年级本科生的软件性能工程课程，教你如何把一段能跑的代码变成跑得飞快的代码。 内容涵盖 Bentley 优化法则、缓存友好的数据结构、向量化、多核并行（Cilk）、 分治与缓存无关算法、性能剖析与实测方法论。配套的矩阵乘法、光线追踪等实验以「加速比排行榜」形式展开， 是把体系结构知识真正转化为工程能力的经典课程。

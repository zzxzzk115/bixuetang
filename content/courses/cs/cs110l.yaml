id: cs110l
title: 系统编程中的安全性（Rust）
code: "CS110L"
institution: 斯坦福大学
subject: cs
level: intermediate
tags: [ Rust, 系统编程, 内存安全, 并发 ]
prerequisites: [ csapp ]
estimatedHours: 45
description: >
  斯坦福 CS110L 用 Rust 作为载体，讲解系统编程中的安全与健壮性问题：内存安全、所有权与借用、错误处理、 trait 与泛型、智能指针、多线程与通道。课程从 C/C++ 的经典崩溃与漏洞讲起，说明 Rust 的设计如何在编译期消灭这些问题。 配套项目包括实现一个简易调试器和多线程代理服务器，实践性很强。

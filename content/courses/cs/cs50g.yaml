id: cs50g
title: 游戏开发导论
code: "CS50G"
institution: Harvard University
subject: cs
level: intermediate
tags: [ 游戏开发, Lua, LÖVE2D, Unity ]
prerequisites: [ cs50 ]
estimatedHours: 60
description: >
  哈佛 CS50 系列的游戏开发分支（GD50），通过复刻 Pong、Flappy Bird、Breakout、 超级马里奥、塞尔达等经典游戏来学习 2D/3D 游戏编程。 前半程用 Lua + LÖVE2D 打基础，后半程转向 Unity/C#， 覆盖状态机、精灵动画、碰撞检测、关卡生成与音效等实战主题。

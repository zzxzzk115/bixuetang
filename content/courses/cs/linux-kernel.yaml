id: linux-kernel
title: Linux 内核源码分析与内核开发
code: "Linux Kernel"
institution: The Linux Kernel Archives / 开源社区
subject: cs
level: advanced
tags: [ 操作系统, Linux, 内核开发, 系统编程 ]
prerequisites: [ mit-6-s081 ]
estimatedHours: 150
description: >
  面向已掌握操作系统原理的学习者，深入真实的 Linux 内核源码：进程调度、 内存管理、文件系统、设备驱动与中断处理等核心子系统。 课程强调阅读与修改真实工业级代码，配合内核文档与补丁提交流程， 是从「懂原理」走向「能改内核」的关键一步。
sources:
  - platform: bilibili
    url: https://www.bilibili.com/video/BV1tQ4y1d7mo
    uploader: 孤雁寒窗（搬运）
    note: 《Linux 内核精讲》全 72 讲，涵盖内核中断架构、调度、内存与源码实现分析
  - platform: other
    url: https://www.kernel.org/doc/html/latest/
    note: 课程官网（Linux 内核官方文档，含开发流程与子系统手册）

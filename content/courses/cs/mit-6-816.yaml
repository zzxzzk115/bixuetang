id: mit-6-816
title: 多核编程与软件性能工程
code: "6.816/6.172"
institution: MIT
subject: cs
level: advanced
tags: [ 并行编程, 性能优化, 多核, 系统 ]
prerequisites: [ csapp ]
estimatedHours: 120
description: >
  MIT 面向高年级的性能工程课程，讲解如何把正确但缓慢的程序改造成榨干现代多核硬件的高性能代码： 缓存与局部性、向量化、Cilk 任务并行、无锁数据结构、竞态检测与性能剖析。 6.172 偏重单机软件性能工程的全流程（含大量实战 project），6.816 则在同一框架下更强调多核与 并发算法（锁、事务内存、并发数据结构）的理论部分，两者课件高度重合，建议以 6.172 的公开 讲座为主线，遇到并发算法章节再补 6.816 的材料。

id: games204
title: 计算成像
code: "GAMES204"
institution: GAMES
subject: cs
level: advanced
tags: [ 计算成像, 计算摄影, 图像处理, 光学 ]
prerequisites: [ games101 ]
estimatedHours: 40
description: >
  GAMES 系列进阶课，讲解计算成像（Computational Imaging）的原理与方法： 相机与光学成像模型、图像信号处理管线、去噪去模糊与超分、高动态范围与光场成像、 以及深度学习驱动的计算摄影。课程把光学、信号处理与图形学串在一起， 适合想从「渲染出图」走向「从真实世界采集图像」的同学。

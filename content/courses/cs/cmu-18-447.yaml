id: cmu-18-447
title: 计算机体系结构
code: "18-447"
institution: Carnegie Mellon University
subject: cs
level: advanced
tags: [ 计算机体系结构, 处理器设计, 存储系统 ]
prerequisites: [ cs61c ]
estimatedHours: 110
description: >
  CMU 由 Onur Mutlu 主讲的本科体系结构课程，从 ISA、单周期/流水线处理器一路讲到 乱序执行、分支预测、Cache 与 DRAM 内存系统、多核与一致性。讲授风格强调「为什么这样设计」 与前沿研究衔接，配套 Verilog 实现完整流水线 CPU 的实验，是打通软硬件边界的经典课程。

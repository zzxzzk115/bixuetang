id: cs3110
title: OCaml 函数式编程与数据结构
code: "Cornell CS3110"
institution: Cornell University
instructor: Michael Ryan Clarkson
subject: cs
level: intermediate
tags: [ 函数式编程, ocaml, 数据结构, 程序语言 ]
prerequisites: [ cs61a ]
estimatedHours: 70
description: >
  康奈尔打磨二十余年的函数式编程课，用 OCaml 讲清模块系统、代数数据类型、高阶函数与惰性求值， 再走到解释器、类型检查与形式化推理。配套开源教材《OCaml Programming: Correct + Efficient + Beautiful》， 是从"会写代码"迈向"懂语言"的最佳桥梁。

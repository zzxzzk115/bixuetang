id: cs170
title: 高效算法与难解问题
code: "UCB CS170"
institution: UC Berkeley
subject: cs
level: advanced
tags: [ 算法, 复杂度, 动态规划, np完全 ]
prerequisites: [ cs61b, mit-6-042j ]
estimatedHours: 90
description: >
  伯克利的算法主干课：分治与 FFT、图算法、贪心、动态规划、线性规划、随机化算法， 最后落到 NP 完全与近似算法。相比入门算法课更强调正确性证明与复杂度分析， 是打牢理论功底、准备科研与面试的硬核之选。

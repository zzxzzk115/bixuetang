id: software-testing
title: 软件测试与质量保证
code: "CS258"
institution: Udacity / 犹他大学
subject: cs
level: intermediate
tags: [ 软件测试, 质量保证, 模糊测试, 代码覆盖率 ]
prerequisites: [ mit-6-031 ]
estimatedHours: 40
description: >
  John Regehr 主讲的软件测试公开课，讲解如何系统地发现程序缺陷：单元测试、随机测试与 模糊测试（fuzzing）、输入生成、测试预言（oracle）、代码覆盖率与静态分析。课程强调 "把测试当成一门工程"，用大量真实编译器与库的崩溃案例说明测试策略如何被设计出来， 是从"会写测试"迈向"会设计测试"的关键一课。

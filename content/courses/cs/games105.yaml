id: games105
title: 计算机角色动画基础
code: "GAMES105"
institution: GAMES (图形学与混合现实研讨会)
subject: cs
level: advanced
tags: [ 角色动画, 动作捕捉, 图形学, 强化学习 ]
prerequisites: [ games101 ]
estimatedHours: 40
description: >
  由北京大学刘利斌老师主讲，讲解如何让虚拟角色自然地动起来。 内容涵盖骨骼蒙皮、正逆运动学、动作捕捉数据处理、动作图与动作匹配，直到基于物理的角色控制与强化学习方法。 课程配套 Python 作业框架，理论与实践结合紧密。

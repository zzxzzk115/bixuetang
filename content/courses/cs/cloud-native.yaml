id: cloud-native
title: 云原生技术公开课（Docker 与 Kubernetes）
code: "Cloud Native"
institution: CNCF / Linux Foundation
subject: cs
level: intermediate
tags: [ 云原生, Kubernetes, Docker, 容器 ]
prerequisites: [ nju-os ]
estimatedHours: 60
description: >
  从容器与镜像原理讲起，系统梳理 Docker 的隔离机制、Kubernetes 的核心对象与调度体系， 再到服务网格、可观测性等云原生生态组件。课程把「操作系统课上学的进程、命名空间、cgroup」 真正落到工业级部署实践上，是从写代码走向交付系统的关键一课。

    uploader: 石分神奇（搬运）
    note: 阿里云 & CNCF 联合推出的云原生技术公开课，全 31 讲完整搬运
  - platform: other
    url: https://kubernetes.io/docs/tutorials/
    note: Kubernetes 官方教程（课程官网）
  - platform: other
    url: https://www.cncf.io/training/
    note: CNCF 官方培训与课程目录

id: cmu-15-418
title: 并行计算架构与编程
code: "15-418"
institution: 卡内基梅隆大学
subject: cs
level: advanced
tags: [ 并行计算, 体系结构, 多核, GPU ]
prerequisites: [ csapp ]
estimatedHours: 90
description: >
  CMU 经典的并行计算课程，从多核 CPU、SIMD、GPU 到分布式内存模型， 系统讲解并行硬件的工作原理与并行程序的设计、优化方法。 课程作业极具分量（ISPC、CUDA、无锁数据结构），是写出真正高性能代码的必经之路。

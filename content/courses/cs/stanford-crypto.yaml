id: stanford-crypto
title: 密码学 I
code: "Cryptography I"
institution: Stanford University
subject: cs
level: advanced
tags: [ 密码学, 安全, 数论, 协议 ]
prerequisites: [ ucb-cs161 ]
estimatedHours: 60
description: >
  Dan Boneh 教授的经典密码学入门课，从一次一密与流密码讲到分组密码、哈希与消息认证、 认证加密，再到公钥加密、RSA、Diffie-Hellman 与数字签名。课程强调"可证明安全"的思维方式： 先严格定义攻击模型，再论证方案为何安全。是理解 TLS、区块链等现代安全系统的必备基础。

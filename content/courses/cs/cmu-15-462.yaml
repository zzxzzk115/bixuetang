id: cmu-15-462
title: 计算机图形学
code: "15-462/662"
institution: 卡内基梅隆大学 CMU
subject: cs
level: advanced
tags: [ 计算机图形学, 渲染, 几何处理, C++ ]
prerequisites: [ games101 ]
estimatedHours: 120
description: >
  CMU 由 Keenan Crane 主讲的图形学经典课程，系统讲解几何表示、网格处理、光栅化、 光线追踪、辐射度量学与动画物理仿真。课程配套 Scotty3D 项目，用 C++ 从零实现 一套完整的建模、渲染与动画工具链，是 GAMES101 之后最值得动手的进阶课。

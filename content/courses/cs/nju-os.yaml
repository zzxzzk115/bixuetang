id: nju-os
title: 操作系统：设计与实现
code: "NJU OS"
institution: 南京大学
instructor: 蒋炎岩
subject: cs
level: advanced
tags: [ 操作系统, 并发, 中文原声 ]
prerequisites: [ csapp ]
estimatedHours: 70
description: >
  三大浪漫之操作系统：用「程序是状态机」的视角贯穿并发、虚拟化与持久化， 现场写代码调试内核。jyy 中文授课，弹幕区大型欢乐现场。

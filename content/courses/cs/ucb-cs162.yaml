id: ucb-cs162
title: 操作系统与系统编程
code: "CS162"
institution: UC Berkeley
subject: cs
level: advanced
tags: [ 操作系统, 并发, 文件系统, 系统编程 ]
prerequisites: [ csapp ]
estimatedHours: 150
description: >
  伯克利的操作系统经典课程，覆盖进程与线程、调度、同步、虚拟内存、 文件系统与分布式系统基础。配套 Pintos 系列实验强度大但收获极高， 是把「读过操作系统」变成「写过操作系统」的关键一课。

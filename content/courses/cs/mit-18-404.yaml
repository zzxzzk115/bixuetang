id: mit-18-404
title: 计算理论
code: "18.404J/6.5400"
institution: 麻省理工学院 MIT
subject: cs
level: advanced
instructor: Michael Sipser
tags: [ 计算理论, 自动机, 可计算性, 复杂度 ]
prerequisites: [ mit-6-042j ]
estimatedHours: 90
description: >
  由《计算理论导引》教材作者 Michael Sipser 本人主讲，从正则语言、上下文无关文法讲到 图灵机、可判定性、归约，再到时间/空间复杂度、NP 完全性与概率计算。板书推导清晰、 节奏从容，是理解「什么问题计算机根本算不了」这一命题最经典的一门课。

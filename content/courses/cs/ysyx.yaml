id: ysyx
title: 一生一芯（从零设计 RISC-V 处理器）
code: "YSYX"
institution: 中国科学院大学 / 中科院计算所
subject: cs
level: advanced
tags: [ 处理器设计, RISC-V, 体系结构, 芯片 ]
prerequisites: [ nju-ics ]
estimatedHours: 400
description: >
  中国科学院「一生一芯」计划的公开课程，带你从零开始设计一款可运行 Linux 的 RISC-V 处理器，并完整走通从 RTL 设计、验证、SoC 集成到流片的全流程。 课程以自学讲义 + 实验为主，强调「自己动手、自己调试」的工程能力， 是国内少有的把体系结构知识真正落到硅片上的实战型课程。

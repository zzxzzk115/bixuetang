id: cs106l
title: 标准 C++ 编程
code: "CS106L"
institution: 斯坦福大学
subject: cs
level: intermediate
tags: [ C++, 现代C++, 编程语言, STL ]
prerequisites: [ cs61a ]
estimatedHours: 40
description: >
  斯坦福 CS106L 是一门讲授「现代 C++ 该怎么写」的短课，聚焦语言本身而非算法：流、类型推导、模板、STL 容器与迭代器、 lambda、移动语义与 RAII 等。课程不要求你从零学语法，而是帮已有编程基础的人建立地道的 C++ 心智模型。 节奏轻快、例子精炼，是从「会写 C 风格代码」跨到「写出优雅 C++」的最短路径之一。

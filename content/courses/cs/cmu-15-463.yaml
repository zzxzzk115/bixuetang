id: cmu-15-463
title: 计算摄影
code: "15-463"
institution: 卡内基梅隆大学 CMU
subject: cs
level: advanced
tags: [计算摄影, 图像处理, 计算机视觉, 光学]
prerequisites: [games101]
estimatedHours: 60
description: >
  CMU 的经典计算摄影课程，讲解相机成像管线、去马赛克、HDR、去卷积、光场、
  编码曝光与孔径等把光学、图像处理与计算结合起来的技术。课程强调动手：
  作业要求你自己处理 RAW 数据、实现完整的图像重建流程，是从渲染走向真实成像的最佳桥梁。

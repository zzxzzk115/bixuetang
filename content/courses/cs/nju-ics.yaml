id: nju-ics
title: 计算机系统基础（ICS-PA / NEMU）
code: "ICS"
institution: 南京大学
subject: cs
level: intermediate
tags: [ 计算机系统, 体系结构, 模拟器, C语言 ]
prerequisites: [ cs61a ]
estimatedHours: 200
description: >
  南京大学计算机系统基础课程，由袁春风、余子濠等老师讲授，系统讲解程序的表示与转换、 链接、异常控制流、存储层次与 I/O。最大特色是配套的 PA 实验：从零用 C 语言实现 一个能跑起真实程序甚至运行小游戏的 x86/RISC-V 模拟器 NEMU，把「程序如何在机器上跑起来」 彻底打通，是国内公认最硬核的自学系统课之一。

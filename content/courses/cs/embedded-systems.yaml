id: embedded-systems
title: 嵌入式系统导论
code: "UT 6.03x"
institution: 德克萨斯大学奥斯汀分校
subject: cs
level: intermediate
tags: [ 嵌入式系统, ARM Cortex-M, 单片机, 实时系统 ]
prerequisites: [ nand2tetris ]
estimatedHours: 80
description: >
  Jonathan Valvano 与 Ramesh Yerraballi 主讲的嵌入式系统课程，以 ARM Cortex-M 微控制器为 平台，从 GPIO、中断、定时器、ADC/DAC 一路讲到有限状态机、串口通信与简易实时内核。 课程配套完整的实验板与在线仿真器，每章都有可动手烧录的工程，是打通"数字电路—体系结构— 操作系统"三者的绝佳桥梁课。

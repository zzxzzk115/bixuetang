id: nand2tetris
title: 计算机系统要素：从与非门到俄罗斯方块
code: "Nand2Tetris"
institution: 希伯来大学
instructor: Shimon Schocken / Noam Nisan
subject: cs
level: intermediate
tags: [ 体系结构, 编译器, 自底向上, 造计算机 ]
prerequisites: [ cs61a ]
estimatedHours: 90
description: >
  从一个与非门出发，亲手搭出 ALU、CPU、汇编器、虚拟机、Jack 语言编译器 和操作系统，最后在自己造的计算机上跑俄罗斯方块。Part I（硬件）零基础可上， Part II（软件栈）需要一定编程成熟度。本站的 Hack 实验室就是这门课的浏览器版。

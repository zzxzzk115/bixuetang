id: mit-6-004
title: 计算结构
code: "6.004"
institution: MIT
subject: cs
level: intermediate
tags: [ 计算机组成, 数字电路, RISC-V, 体系结构 ]
prerequisites: [ nand2tetris ]
estimatedHours: 120
description: >
  MIT 经典的计算机系统底层课程，从 MOS 晶体管、组合与时序逻辑一路搭到完整的 RISC-V 流水线处理器，再讲到 Cache、虚拟内存、异常与并发同步。 它填补了「数字电路」与「操作系统」之间最关键的一段空白， 实验用 Minispec/BSV 硬件描述语言亲手实现处理器，学完能真正说清楚一条指令是怎么被执行的。

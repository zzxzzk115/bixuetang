id: cs106b
title: 编程抽象
code: "CS106B"
institution: Stanford University
subject: cs
level: intermediate
tags: [ C++, 数据结构, 递归, 算法 ]
prerequisites: [ cs106l ]
estimatedHours: 90
description: >
  斯坦福大学面向编程入门后第二门课，用 C++ 系统讲解抽象数据类型、递归与回溯、 指针与动态内存、链表与二叉搜索树、图算法以及算法复杂度分析。 课程作业质量极高，是从「会写代码」跨越到「会设计程序」的经典阶梯， 也是后续学习 CS161 算法课最扎实的铺垫。

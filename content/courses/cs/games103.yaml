id: games103
title: 基于物理的计算机动画入门
code: "GAMES103"
institution: GAMES (图形学与混合现实研讨会)
subject: cs
level: advanced
tags: [ 物理仿真, 计算机动画, 图形学, 物理引擎 ]
prerequisites: [ games101 ]
estimatedHours: 40
description: >
  由王华民老师主讲的物理动画入门课程，系统讲解刚体、弹性体、布料与流体的数值仿真方法。 课程从数学与力学基础讲起，逐步推进到隐式积分、碰撞处理与有限元，是自己动手写物理引擎的最佳中文起点。 每章配有编程作业，用 Unity 从零实现各类仿真效果。

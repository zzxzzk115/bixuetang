id: cmu-15-721
title: 高级数据库系统
code: "CMU 15-721"
institution: CMU
instructor: Andy Pavlo
subject: cs
level: advanced
tags: [ 数据库, 内存数据库, 查询优化, 分布式 ]
prerequisites: [ cmu-15-445 ]
estimatedHours: 80
description: >
  15-445 的进阶续作，聚焦现代内存数据库与 OLAP 系统的设计：多版本并发控制、列存与压缩、 向量化执行、查询编译、优化器与调度。课程以论文研讨加系统剖析为主，讲的是工业界真实数据库 （如 DuckDB、Snowflake、Postgres）如何做取舍，适合想深入数据库内核的人。

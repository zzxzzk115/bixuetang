id: nju-sa
title: 软件分析（静态程序分析）
code: "Static Program Analysis"
institution: 南京大学
subject: cs
level: advanced
tags: [ 静态分析, 程序分析, 数据流分析, 指针分析 ]
prerequisites: [ cs143 ]
estimatedHours: 80
description: >
  南京大学李樾、谭添老师讲授的《软件分析》，是中文世界最系统的静态程序分析入门课。 内容涵盖数据流分析、格与不动点理论、过程间分析、指针分析、CFL 可达性、 IFDS 与污点分析等核心主题，并配套 Tai-e 框架的编程作业与在线评测。 讲解由浅入深、逻辑严密，适合想做编译器、安全或软件工程研究的同学。

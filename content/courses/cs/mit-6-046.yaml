code: "MIT 6.046J"
institution: 麻省理工学院
instructor: Erik Demaine, Srini Devadas, Nancy Lynch
subject: cs
level: advanced
tags: [ 算法, 分治, 动态规划, 复杂度 ]
prerequisites: [ mit-6-006 ]
estimatedHours: 90
description: >
  MIT 本科算法进阶课，6.006 的直接后继，覆盖分治、动态规划、网络流、 线性规划、NP 完全性与近似算法等核心主题。由 Erik Demaine 等名师主讲， 讲课清晰严谨，配套习题质量极高，是通往算法竞赛与理论研究的必经之路。

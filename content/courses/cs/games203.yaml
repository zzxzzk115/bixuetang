description: >
  GAMES203 系统讲解三维重建与理解的核心方法：从扫描获取点云、配准（Registration）、 曲面重建，到形状分析、语义理解与深度学习在三维数据上的应用。 由 UT Austin 黄其兴老师主讲，中文授课，是国内少见的成体系三维视觉/几何处理课程。

id: cs186
title: 数据库系统导论
code: "UCB CS186"
institution: UC Berkeley
subject: cs
level: advanced
tags: [ 数据库, sql, 查询优化, 事务 ]
prerequisites: [ cs61b ]
estimatedHours: 70
description: >
  伯克利的数据库入门课，系统讲解 SQL、存储与索引、缓冲池、连接算法、查询优化、 事务与并发控制，并延伸到 NoSQL、MapReduce 与 Spark。 配套 Java 实现的 rookiedb 项目，动手补全一个真实数据库的核心模块，实践性极强。

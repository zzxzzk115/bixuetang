id: games301
title: 曲面参数化
code: "GAMES301"
institution: 中国科学技术大学 / GAMES
subject: cs
level: advanced
tags: [ 几何处理, 曲面参数化, 网格, 数值优化 ]
prerequisites: [ games101 ]
estimatedHours: 40
description: >
  GAMES 系列几何处理进阶课，系统讲解曲面参数化（Surface Parameterization）： 从调和映射、共形映射等经典理论，到无翻转、低畸变参数化的现代数值优化方法， 以及在纹理映射、重网格化、形状分析中的应用。中文授课，理论推导与代码作业并重， 是国内少有的成体系几何处理课程。

id: software-foundations
title: 软件基础（Coq 形式化验证）
code: "Software Foundations"
institution: 宾夕法尼亚大学
subject: cs
level: advanced
tags: [ Coq, 形式化验证, 定理证明, 程序语言理论 ]
prerequisites: [ cs3110 ]
estimatedHours: 120
description: >
  由 Benjamin Pierce 领衔编写的形式化验证经典教材与配套课程，用 Coq 证明助手把逻辑、 函数式程序和程序语言语义讲成可机器检查的证明。全书每一章本身就是一个可编译的 Coq 文件， 读者边读边补全证明，是进入类型论与程序验证领域最扎实的入门路径。

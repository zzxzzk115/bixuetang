description: >
  文献综述不是「把读过的论文复述一遍」,而是系统地检索、筛选、归纳、批判。这门课 按 systematic review 的规范流程走:定研究问题、定检索式、按纳入/排除标准筛文献、 提炼主题并批判性综合。研究生入门第一课,少走很多弯路。

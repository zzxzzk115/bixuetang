description: >
  Zotero 是科研党管理文献的免费利器:一键抓取文献、自动生成参考文献、写作时随手 插引用。这门保姆级教程从安装、抓取、分类到与 Word/LaTeX 联动全讲透。学会它, 读文献、攒综述、写论文的效率能翻一倍——研究生越早上手越好。

id: mit-18-901
title: 拓扑学导论
code: "18.901"
institution: MIT
subject: math
level: advanced
tags: [ 拓扑学, 点集拓扑, 连通性与紧性, 数学分析进阶 ]
prerequisites: [ mit-18-100 ]
estimatedHours: 120
description: >
  MIT 数学系的点集拓扑入门课，教材为 Munkres《Topology》。内容涵盖拓扑空间与连续映射、 连通性、紧性、分离公理、度量化定理以及基本群初步。它把实分析里"开集、极限、连续"的直觉 提升为一般框架，是通往微分几何、代数拓扑与现代几何的必经之路。

tags: [ 金融数学, 随机过程, 时间序列, 概率 ]
prerequisites: [ stat110 ]
estimatedHours: 50
description: >
  MIT 数学系与业界从业者合开的金融数学专题课，讲解线性代数、概率、随机过程、 时间序列与最优化如何被用在真实的定价、投资组合与风险管理问题上。 课程由多位讲者分专题主讲，兼顾数学推导与市场直觉，是从概率论走向量化金融的经典桥梁课。

id: games001
title: 图形学中的数学
code: "GAMES001"
institution: 北京大学 / GAMES
subject: math
level: intermediate
tags: [ 图形学数学, 线性代数, 微分几何, 数值方法 ]
prerequisites: [ mit-18-06 ]
estimatedHours: 60
description: >
  由北京大学陈宝权、倪星宇、阮良旺主讲的 GAMES 系列基础课，只要求微积分与线性代数基础。 课程系统梳理图形学所需的数学工具：向量与矩阵、变换与旋转表示、微分与积分、 优化与数值方法、概率与蒙特卡洛等，并在每章结合图形学实例说明其用途。 是补齐 GAMES101/202 数学短板的最佳中文课程。

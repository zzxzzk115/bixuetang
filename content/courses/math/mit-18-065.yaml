id: mit-18-065
title: 数据分析、信号处理和机器学习中的矩阵方法
code: "18.065"
institution: MIT
instructor: Gilbert Strang
subject: math
level: advanced
tags: [ 线性代数, 机器学习, 数据分析 ]
prerequisites: [ mit-18-06 ]
estimatedHours: 80
description: >
  Gilbert Strang 在 18.06 之后开设的"线性代数第二课"，聚焦矩阵方法在数据分析、 信号处理与机器学习中的实际应用：SVD、低秩逼近、随机采样、优化与深度学习基础。 是从纯线性代数走向现代数据科学的最佳桥梁课，Strang 晚年集大成之作。

id: stat110
title: 概率论
code: "Harvard STAT 110"
institution: Harvard
instructor: Joe Blitzstein
subject: math
level: intermediate
tags: [ 概率论, 随机变量, 马尔可夫链 ]
prerequisites: [ mit-18-01 ]
estimatedHours: 70
description: >
  哈佛大学最负盛名的概率论公开课，从计数原理一路讲到条件概率、随机变量、 期望、极限定理与马尔可夫链。Blitzstein 教授擅长用故事和直觉拆解反直觉的 概率问题，是机器学习与统计方向公认最好的概率论自学课程。

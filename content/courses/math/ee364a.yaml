id: ee364a
title: 凸优化 I
code: "EE364A"
institution: Stanford University
subject: math
level: advanced
tags: [ 凸优化, 数学建模, 数值算法 ]
prerequisites: [ mit-18-06 ]
estimatedHours: 90
description: >
  Stephen Boyd 主讲的斯坦福凸优化第一门课，从凸集、凸函数讲到对偶理论与内点法， 并覆盖大量工程建模实例。它是机器学习、控制、信号处理、金融工程共同的数学底座， 学完能把实际问题识别、改写成可高效求解的凸问题，并用 CVX/CVXPY 落地。

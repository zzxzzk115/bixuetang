id: mit-6-041
title: 概率系统分析与应用概率
code: "6.041"
institution: MIT
instructor: John Tsitsiklis
subject: math
level: intermediate
tags: [ 概率论, 随机过程, 贝叶斯 ]
prerequisites: [ mit-18-01 ]
estimatedHours: 60
description: >
  MIT 经典概率论入门课，由 John Tsitsiklis 讲授，从概率模型与公理出发， 系统覆盖条件概率、随机变量、极限定理、贝叶斯推断与随机过程。 讲解极为清晰严谨，配套教材《Introduction to Probability》被广泛誉为概率论最佳入门书。

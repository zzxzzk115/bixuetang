description: >
  MIT 研究生层次的离散随机过程课程，由信息论泰斗 Robert Gallager 主讲。
  内容涵盖泊松过程、更新过程、有限状态与可数状态马尔可夫链、鞅、随机游动与排队论。
  讲授风格强调直观理解与严格推导并重，是进入信息论、通信、性能建模与强化学习理论的关键桥梁。

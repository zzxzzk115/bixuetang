id: abstract-algebra
title: 抽象代数
code: "E-222"
institution: Harvard University
subject: math
level: advanced
tags: [ 抽象代数, 群论, 环与域, 线性代数进阶 ]
prerequisites: [ mit-18-06 ]
estimatedHours: 100
description: >
  哈佛大学 Benedict Gross 教授主讲的抽象代数课程，以 Artin《Algebra》为教材， 从矩阵群与对称性入手讲解群、环、域及其表示论初步。Gross 的讲法极重几何直觉， 把抽象结构还原成可以"看见"的对称变换，是理解近世代数最经典的公开课之一。

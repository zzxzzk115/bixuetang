id: mit-18-100
title: 实分析
code: "18.100"
institution: MIT
subject: math
level: advanced
tags: [ 实分析, 数学分析, 证明, 极限 ]
prerequisites: [ mit-18-02 ]
estimatedHours: 120
description: >
  MIT 数学系的实分析课程，用严格的 epsilon-delta 语言重建微积分的地基：实数完备性、 数列与级数收敛、连续性、可微性、黎曼积分与函数列一致收敛。这是从“会算”走向“会证”的 分水岭课程，也是后续测度论、泛函分析、拓扑学的必经之路。课程强调自己动手写证明。

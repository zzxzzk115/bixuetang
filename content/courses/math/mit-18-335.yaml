tags: [ 数值分析, 数值线性代数, 浮点运算, 科学计算 ]
prerequisites: [ mit-18-06 ]
estimatedHours: 100
description: >
  MIT 研究生层次的数值方法课程，核心是数值算法的精度与效率：浮点运算与舍入误差、 条件数与稳定性、后向误差分析，以及稠密与稀疏矩阵的线性方程组、最小二乘和特征值算法。 课程由 Steven G. Johnson 讲授，大量结合 Julia 实操，是把线性代数真正用起来的关键一课。
  注意：本课无公开录像，以官网讲义与 Julia notebook 自学为主。

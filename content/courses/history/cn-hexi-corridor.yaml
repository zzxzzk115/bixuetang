description: >
  豆瓣高分纪录片《河西走廊》,以雅尼配乐与情景再现著称,从张骞出使、汉设四郡,
  到魏晋佛法东传、隋唐丝路鼎盛、蒙元会盟与敦煌宝藏——用一条走廊串起两千年
  中原与西域、东方与世界的交流史。权威唯美,是通史之外极佳的丝路专题。

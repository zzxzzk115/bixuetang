id: mit-8-05
title: 量子物理 II
code: "8.05"
institution: MIT
subject: physics
level: advanced
tags: [ 量子力学, 角动量, 自旋, 希尔伯特空间 ]
prerequisites: [ mit-8-04 ]
estimatedHours: 80
description: >
  MIT 量子力学第二学期课程，由弦论学者 Barton Zwiebach 主讲。 从量子力学的一般形式体系出发，系统讲解态矢与算符、谐振子的代数解法、三维量子力学、 角动量与自旋、角动量耦合等核心内容。讲义后来发展为教材《Mastering Quantum Mechanics》， 推导干净、逻辑严整，是把量子力学从「解薛定谔方程」提升到「线性代数语言」的关键一课。

id: mit-8-962
title: 广义相对论
code: "8.962"
institution: MIT
subject: physics
level: advanced
tags: [ 广义相对论, 微分几何, 引力, 宇宙学 ]
prerequisites: [ mit-8-05 ]
estimatedHours: 150
description: >
  MIT 研究生层次的广义相对论课程，系统讲授张量分析、流形与曲率、爱因斯坦场方程， 以及黑洞、引力波和宇宙学解等应用。课程数学与物理并重， 是从狭义相对论迈向现代引力理论与天体物理研究的标准入门课。

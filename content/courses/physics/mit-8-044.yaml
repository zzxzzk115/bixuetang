id: mit-8-044
title: 统计物理 I
code: "8.044"
institution: MIT
subject: physics
level: advanced
tags: [ 统计力学, 热力学, 概率论, 系综 ]
prerequisites: [ mit-8-03 ]
estimatedHours: 120
description: >
  MIT 面向物理系本科生的统计物理第一门课，从概率论基础出发，建立微正则、正则、巨正则系综， 并推导出经典热力学的全部定律。课程强调「微观概率如何涌现出宏观热力学」， 是理解相变、量子统计与凝聚态物理的必经之路。

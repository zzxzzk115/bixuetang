description: >
  牛顿力学、守恒律、刚体转动、万有引力，一路讲到狭义相对论、热力学与波动。 Shankar 教授板书清晰、推导完整，善于把公式背后的物理意义讲透， 是自学者补齐大学物理基础的经典之选。

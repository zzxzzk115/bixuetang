jobs:
  # ---------- 0 转 ----------
  - id: novice
    title: 见习学徒
    tier: 0
    parents: []
    requires: {}
    description: 每个冒险者的起点。注册即获得。

  # ---------- 1 转 ----------
  - id: cs-apprentice
    title: 计算机学徒
    tier: 1
    parents: [novice]
    requires:
      minLevel: 3
      skills: { allOf: [programming-basics] }
    description: 你已能用代码召唤逻辑。
  - id: math-apprentice
    title: 数学学徒
    tier: 1
    parents: [novice]
    requires:
      minLevel: 3
      skills: { anyOf: [calculus, linear-intuition, discrete-math, probability], minAnyOf: 1 }
    description: 你开始读懂宇宙的母语。
  - id: physics-apprentice
    title: 物理学徒
    tier: 1
    parents: [novice]
    requires:
      minLevel: 3
      skills: { allOf: [classical-mechanics] }
    description: 你与万有引力签订了契约。
  - id: ai-apprentice
    title: AI 学徒
    tier: 1
    parents: [novice]
    requires:
      minLevel: 3
      skills: { allOf: [ml-basics] }
    description: 你教会了机器第一课。

  # ---------- 2 转 ----------
  - id: systems-warden
    title: 系统守卫
    tier: 2
    parents: [cs-apprentice]
    requires:
      minLevel: 8
      skills: { allOf: [computer-systems], anyOf: [algorithms, distributed-systems, operating-systems, networks, databases, security, parallel-computing], minAnyOf: 1 }
    description: 从比特到集群，皆在你的守望之下。
  - id: algo-duelist
    title: 算法决斗家
    tier: 2
    parents: [cs-apprentice]
    requires:
      minLevel: 8
      skills: { allOf: [algorithms] }
    description: 以复杂度为剑，一击制胜。
  - id: arcane-engineer
    title: 奥术工程师
    tier: 2
    parents: [cs-apprentice, math-apprentice]
    requires:
      minLevel: 10
      skills: { allOf: [linear-algebra] }
    description: 兼修代码与数学的复合职业——用矩阵驱动机器。
  - id: natural-philosopher
    title: 自然哲学家
    tier: 2
    parents: [math-apprentice, physics-apprentice]
    requires:
      minLevel: 10
      skills: { allOf: [electromagnetism] }
    description: 兼修数学与物理的复合职业——继承牛顿的衣钵。
  - id: ml-alchemist
    title: 机学炼金术士
    tier: 2
    parents: [ai-apprentice]
    requires:
      minLevel: 8
      skills: { allOf: [deep-learning] }
    description: 把数据点石成金。
  - id: render-mage
    title: 渲染法师
    tier: 2
    parents: [cs-apprentice, math-apprentice]
    requires:
      minLevel: 10
      skills: { allOf: [computer-graphics] }
    description: 兼修代码与数学的复合职业——以矩阵为咒文，渲染整个世界。
  - id: romanticist
    title: 浪漫主义者
    tier: 2
    parents: [cs-apprentice]
    requires:
      minLevel: 12
      skills: { allOf: [computer-graphics, operating-systems, compilers] }
    description: 图形、内核、编译三大浪漫全修的传说职业。
  - id: compiler-artisan
    title: 编译匠人
    tier: 2
    parents: [cs-apprentice]
    requires:
      minLevel: 10
      skills: { allOf: [compilers] }
    description: 词法、语法与代码生成尽在掌握——你能造出自己的语言。
  - id: net-ranger
    title: 网络游侠
    tier: 2
    parents: [cs-apprentice]
    requires:
      minLevel: 8
      skills: { allOf: [networks] }
    description: 亲手实现过协议栈的人，才真正懂得数据包的旅程。
  - id: data-curator
    title: 数据守藏吏
    tier: 2
    parents: [cs-apprentice]
    requires:
      minLevel: 8
      skills: { allOf: [databases] }
    description: 索引、事务与查询优化——海量数据在你手中井然有序。
  - id: silicon-smith
    title: 硅之锻造师
    tier: 2
    parents: [cs-apprentice, physics-apprentice]
    requires:
      minLevel: 12
      skills: { allOf: [chip-design] }
    description: 兼修代码与物理的复合职业——从与非门一路锻造到自己的处理器。
  - id: cryptographer
    title: 密文术士
    tier: 2
    parents: [cs-apprentice, math-apprentice]
    requires:
      minLevel: 10
      skills: { allOf: [security] }
    description: 兼修代码与数学的复合职业——以数论为盾，以攻防为镜。
  - id: quantum-scholar
    title: 量子学者
    tier: 2
    parents: [physics-apprentice, math-apprentice]
    requires:
      minLevel: 12
      skills: { allOf: [quantum-physics] }
    description: 兼修物理与数学的复合职业——在希尔伯特空间中安居。
  - id: mecha-engineer
    title: 机甲工程师
    tier: 2
    parents: [cs-apprentice, physics-apprentice]
    requires:
      minLevel: 10
      skills: { allOf: [robotics] }
    description: 兼修代码与物理的复合职业——让钢铁按你的方程运动。
  - id: bio-hacker
    title: 生信术士
    tier: 2
    parents: [ai-apprentice]
    requires:
      minLevel: 10
      skills: { allOf: [computational-biology] }
    description: 把神经网络对准基因组——在生命的源码里做模式识别。
  - id: polymath
    title: 全知贤者
    tier: 2
    parents: [cs-apprentice, math-apprentice, physics-apprentice, ai-apprentice]
    requires:
      minLevel: 15
    description: 四系皆通的传说职业。

  # ---------- 3 转（传说） ----------
  - id: grand-architect
    title: 架构宗师
    tier: 3
    parents: [systems-warden]
    requires:
      minLevel: 18
      skills: { allOf: [operating-systems], anyOf: [distributed-systems, networks, databases, parallel-computing, security], minAnyOf: 2 }
    description: 内核、网络、存储与集群融会贯通——系统世界的立法者。
  - id: engine-soul
    title: 引擎之魂
    tier: 3
    parents: [render-mage]
    requires:
      minLevel: 18
      skills: { allOf: [computer-graphics, game-engine], anyOf: [operating-systems, compilers, linear-algebra, game-dev, parallel-computing, physics-animation], minAnyOf: 1 }
    description: 渲染、引擎与系统合一，亲手铸造游戏引擎的传说职业。
  - id: machine-prophet
    title: 智械先知
    tier: 3
    parents: [ml-alchemist]
    requires:
      minLevel: 18
      skills: { allOf: [deep-learning], anyOf: [computer-vision, nlp, reinforcement-learning, generative-ai, large-models, data-science], minAnyOf: 2 }
    description: 视觉、语言与决策皆入掌中——预见机器智能的走向。
  - id: language-creator
    title: 造语者
    tier: 3
    parents: [compiler-artisan]
    requires:
      minLevel: 18
      skills: { allOf: [compilers], anyOf: [formal-verification, theory-of-computation, prog-languages, parallel-computing], minAnyOf: 2 }
    description: 语法、语义与证明三位一体——你定义的不只是语言，还是它的意义。
  - id: cloud-overlord
    title: 云之霸主
    tier: 3
    parents: [systems-warden]
    requires:
      minLevel: 20
      skills: { allOf: [cloud-native, distributed-systems] }
    description: 千机如一臂之使——把整座数据中心当作一台机器来编程。
  - id: silicon-lord
    title: 硅之君王
    tier: 3
    parents: [silicon-smith]
    requires:
      minLevel: 20
      skills: { allOf: [chip-design], anyOf: [operating-systems, compilers, embedded, parallel-computing], minAnyOf: 2 }
    description: 从晶体管到编译器全栈自持——软硬边界在你眼中并不存在。
  - id: cosmos-theorist
    title: 宇宙论者
    tier: 3
    parents: [natural-philosopher]
    requires:
      minLevel: 20
      skills: { allOf: [general-relativity], anyOf: [quantum-physics, statistical-mechanics, waves, differential-equations], minAnyOf: 2 }
    description: 相对论与量子论同时握在手里——直面物理学最深的那道裂缝。
  - id: quantum-engineer
    title: 量子工程师
    tier: 3
    parents: [quantum-scholar]
    requires:
      minLevel: 20
      skills: { allOf: [quantum-computing], anyOf: [algorithms, linear-algebra, information-theory, theory-of-computation], minAnyOf: 2 }
    description: 把叠加态编成程序——在经典算力的尽头之外开辟战场。
  - id: math-archmage
    title: 数学大魔导
    tier: 3
    parents: [arcane-engineer]
    requires:
      minLevel: 20
      skills: { allOf: [real-analysis], anyOf: [topology, abstract-algebra, optimization, numerical-methods, information-theory, mathematical-finance], minAnyOf: 2 }
    description: 分析、代数与拓扑三线并进——在最抽象处看见最普遍的结构。
  - id: omniscient-sage
    title: 万象大贤者
    tier: 3
    parents: [polymath]
    requires:
      minLevel: 25
      skills: { anyOf: [distributed-systems, computer-graphics, waves, generative-ai, linear-algebra], minAnyOf: 3 }
    description: 横跨四系高峰的终极传说——公会史册将记下你的名字。

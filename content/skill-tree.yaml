nodes:
  # ---------- 计算机 ----------
  - id: programming-basics
    title: 程序设计基础
    subject: cs
    tier: 1
    requires: []
    courses: [cs61a, cs50]
    rule: any
    description: 会用抽象组织程序，理解递归与高阶函数。
  - id: cli-toolbox
    title: 工匠工具箱
    subject: cs
    tier: 1
    requires: []
    courses: [missing-semester]
    rule: any
    description: Shell / Git / Vim / 调试工具运用自如。
  - id: computer-systems
    title: 计算机系统
    subject: cs
    tier: 2
    requires: [programming-basics]
    courses: [csapp, nand2tetris, cs61c, nju-ics, mit-6-004, cmu-18-447, digital-design]
    rule: any
    description: 理解程序在机器上如何真正运行——自顶向下（CSAPP）、自底向上（Nand2Tetris）或伯克利路线（CS61C）任选。
  - id: algorithms
    title: 算法之刃
    subject: cs
    tier: 2
    requires: [programming-basics]
    courses: [mit-6-006, cs61b, cs170, mit-6-046, cs106b, cmu-15-451]
    rule: any
    description: 掌握核心数据结构与算法设计范式。
  - id: theory-of-computation
    title: 计算之界
    subject: cs
    tier: 3
    cost: 2
    requires: [discrete-math]
    courses: [mit-18-404, mit-6-045]
    rule: any
    description: 自动机、可计算性与 NP——什么问题机器永远解不了。
  - id: formal-verification
    title: 形式之证
    subject: cs
    tier: 3
    cost: 2
    requires: [prog-languages]
    courses: [software-foundations]
    rule: any
    description: 用 Coq 证明程序正确，而不只是测试它。
  - id: software-engineering
    title: 工程之道
    subject: cs
    tier: 2
    requires: [programming-basics]
    courses: [mit-6-031, software-testing]
    rule: any
    description: 可靠、易改、易读——把代码写成工程。
  - id: prog-languages
    title: 语言之艺
    subject: cs
    tier: 2
    requires: [programming-basics]
    courses: [cs106l, cs110l, cs3110, cis194]
    rule: any
    description: C++、Rust、OCaml、Haskell——不同范式塑造不同的思维。
  - id: web-fullstack
    title: 全栈之路
    subject: cs
    tier: 2
    requires: [programming-basics]
    courses: [fullstackopen, cs142, cs50w]
    rule: any
    description: 从 React 到 Node，把想法变成能上线的产品。
  - id: distributed-systems
    title: 分布式之心
    subject: cs
    tier: 3
    cost: 2
    requires: [computer-systems, algorithms]
    courses: [mit-6-824]
    rule: any
    description: 驾驭共识、复制与容错。
  - id: computer-graphics
    title: 图形之光
    subject: cs
    tier: 3
    cost: 2
    requires: [programming-basics, linear-intuition]
    courses: [games101, games202, cmu-15-462, games203, games204, games301, cmu-15-463]
    rule: any
    description: 三大浪漫之一：亲手渲染出一个世界。
  - id: physics-animation
    title: 仿真之律
    subject: cs
    tier: 3
    cost: 2
    requires: [computer-graphics]
    courses: [games103, games105]
    rule: any
    description: 刚体、布料、流体与角色动画——让虚拟世界动起来。
  - id: game-dev
    title: 游戏之匠
    subject: cs
    tier: 3
    cost: 2
    requires: [programming-basics]
    courses: [cs50g]
    rule: any
    description: 从 Pong 到塞尔达——把玩法变成代码。
  - id: game-engine
    title: 引擎之心
    subject: cs
    tier: 3
    cost: 2
    requires: [computer-graphics]
    courses: [games104, thecherno-engine]
    rule: any
    description: 把渲染、物理与工具链熔铸成一台引擎。
  - id: operating-systems
    title: 内核奥义
    subject: cs
    tier: 3
    cost: 2
    requires: [computer-systems]
    courses: [nju-os, mit-6-s081, ucb-cs162, linux-kernel]
    rule: any
    description: 三大浪漫之二：状态机视角驾驭并发与虚拟化。
  - id: networks
    title: 网络之径
    subject: cs
    tier: 3
    cost: 2
    requires: [computer-systems]
    courses: [cs144, ucb-cs168]
    rule: any
    description: 从比特流到 TCP——亲手实现一个协议栈。
  - id: databases
    title: 数据之库
    subject: cs
    tier: 3
    cost: 2
    requires: [computer-systems]
    courses: [cmu-15-445, cs186, cmu-15-721]
    rule: any
    description: 存储引擎、索引与事务的内部世界。
  - id: compilers
    title: 编译之艺
    subject: cs
    tier: 3
    cost: 2
    requires: [computer-systems]
    courses: [cs143, nju-sa, cmu-15-411, ustc-compiler, llvm-tutorial]
    rule: any
    description: 三大浪漫之三：铸造属于自己的语言。
  - id: parallel-computing
    title: 并行之力
    subject: cs
    tier: 3
    cost: 2
    requires: [computer-systems]
    courses: [cmu-15-418, mit-6-172, mit-6-816]
    rule: any
    description: 多核、SIMD 与 GPU——榨干每一寸算力。
  - id: security
    title: 安全之盾
    subject: cs
    tier: 3
    cost: 2
    requires: [computer-systems]
    courses: [ucb-cs161, stanford-crypto, mit-6-858]
    rule: any
    description: 攻防视角下的系统与密码学。
  - id: chip-design
    title: 硅之刻印
    subject: cs
    tier: 3
    cost: 2
    requires: [computer-systems]
    courses: [ysyx]
    rule: any
    description: 从 RTL 到流片——把自己写的处理器真正刻进硅片。
  - id: embedded
    title: 嵌入之匠
    subject: cs
    tier: 3
    cost: 2
    requires: [computer-systems]
    courses: [embedded-systems]
    rule: any
    description: 中断、外设与实时约束——让代码驱动物理世界。
  - id: robotics
    title: 机械之臂
    subject: cs
    tier: 3
    cost: 2
    requires: [linear-algebra]
    courses: [cs223a]
    rule: any
    description: 运动学、动力学与轨迹规划——赋予机械以动作。
  - id: cloud-native
    title: 云之疆域
    subject: cs
    tier: 4
    cost: 3
    requires: [distributed-systems]
    courses: [cloud-native]
    rule: any
    description: 容器、编排与弹性伸缩——把分布式系统交付到生产。

  # ---------- 数学 ----------
  - id: calculus
    title: 微积分
    subject: math
    tier: 1
    requires: []
    courses: [mit-18-01, mit-18-02, essence-of-calculus]
    rule: any
    description: 极限、导数与积分——变化的语言。
  - id: discrete-math
    title: 离散之基
    subject: math
    tier: 1
    requires: []
    courses: [mit-6-042j]
    rule: any
    description: 证明、图论与计数——算法正确性的语言。
  - id: linear-intuition
    title: 线性直觉
    subject: math
    tier: 1
    requires: []
    courses: [essence-of-linear-algebra]
    rule: any
    description: 用几何之眼看见矩阵。
  - id: linear-algebra
    title: 线性代数
    subject: math
    tier: 2
    requires: [linear-intuition]
    courses: [mit-18-06, mit-18-065, games001]
    rule: any
    description: 四个基本子空间与 SVD 的完全掌握。
  - id: real-analysis
    title: 分析之严
    subject: math
    tier: 3
    cost: 2
    requires: [calculus]
    courses: [mit-18-100]
    rule: any
    description: ε-δ 的世界——把微积分建立在磐石之上。
  - id: numerical-methods
    title: 数值之算
    subject: math
    tier: 3
    cost: 2
    requires: [linear-algebra]
    courses: [mit-18-335]
    rule: any
    description: 浮点、误差与稳定性——让数学在机器上跑得准。
  - id: probability
    title: 概率之眼
    subject: math
    tier: 2
    requires: [calculus]
    courses: [stat110, mit-6-041, mit-6-262]
    rule: any
    description: 用分布与期望描述不确定的世界。
  - id: differential-equations
    title: 微分之律
    subject: math
    tier: 2
    requires: [calculus]
    courses: [mit-18-03]
    rule: any
    description: 用方程刻画万物如何随时间演化。
  - id: abstract-algebra
    title: 代数之构
    subject: math
    tier: 2
    requires: [discrete-math]
    courses: [abstract-algebra]
    rule: any
    description: 群、环、域——从对称性中看见结构本身。
  - id: information-theory
    title: 信息之熵
    subject: math
    tier: 3
    cost: 2
    requires: [probability]
    courses: [ee376a]
    rule: any
    description: 熵、信道容量与压缩极限——为「信息」定出斤两。
  - id: mathematical-finance
    title: 金数之算
    subject: math
    tier: 3
    cost: 2
    requires: [probability]
    courses: [mit-18-s096]
    rule: any
    description: 随机过程与定价模型——把不确定性折算成价格。
  - id: topology
    title: 拓扑之形
    subject: math
    tier: 4
    cost: 3
    requires: [real-analysis]
    courses: [mit-18-901]
    rule: any
    description: 抛开度量只留形状——通往现代几何的门槛。

  # ---------- 物理 ----------
  - id: classical-mechanics
    title: 经典力学
    subject: physics
    tier: 1
    requires: [calculus]
    courses: [mit-8-01, yale-phys-200]
    rule: any
    description: 牛顿的世界观。
  - id: electromagnetism
    title: 电磁奥秘
    subject: physics
    tier: 2
    requires: [classical-mechanics]
    courses: [mit-8-02]
    rule: any
    description: 麦克斯韦方程组在手。
  - id: waves
    title: 波之律动
    subject: physics
    tier: 3
    cost: 2
    requires: [electromagnetism]
    courses: [mit-8-03]
    rule: any
    description: 从振子到光——通往量子世界的桥。
  - id: quantum-physics
    title: 量子之门
    subject: physics
    tier: 3
    cost: 2
    requires: [waves]
    courses: [mit-8-04, mit-8-05]
    rule: any
    description: 波函数、叠加与不确定性——微观世界的语言。
  - id: statistical-mechanics
    title: 统计之熵
    subject: physics
    tier: 3
    cost: 2
    requires: [classical-mechanics]
    courses: [mit-8-044]
    rule: any
    description: 从分子的混沌中涌现出温度与熵的宏观秩序。
  - id: general-relativity
    title: 时空之曲
    subject: physics
    tier: 3
    cost: 2
    requires: [electromagnetism]
    courses: [mit-8-962]
    rule: any
    description: 引力不是力，而是时空的形状——爱因斯坦的世界观。
  - id: quantum-computing
    title: 量子之算
    subject: physics
    tier: 4
    cost: 3
    requires: [quantum-physics]
    courses: [mit-8-370]
    rule: any
    description: 叠加与纠缠化作算力——Shor 与 Grover 的疆域。

  # ---------- AI ----------
  - id: ml-basics
    title: 机器学习基础
    subject: ai
    tier: 1
    requires: [linear-intuition]
    courses: [andrew-ng-ml, cs188, mit-6-034, essence-of-neural-networks, mit-6-390]
    rule: any
    description: 监督学习与经典 AI 的基本功。
  - id: data-science
    title: 数据之术
    subject: ai
    tier: 2
    requires: [ml-basics]
    courses: [berkeley-data100, stanford-cs246]
    rule: any
    description: 采集、清洗、可视化与推断——数据说话的完整链路。
  - id: optimization
    title: 最优之径
    subject: math
    tier: 3
    cost: 2
    requires: [linear-algebra]
    courses: [ee364a]
    rule: any
    description: 凸集、对偶与内点法——把难题化成能高效求解的形状。
  - id: ml-theory
    title: 统计学习之理
    subject: ai
    tier: 2
    requires: [ml-basics]
    courses: [cs229]
    rule: any
    description: 白板推导出的机器学习数学根基。
  - id: deep-learning
    title: 深度学习
    subject: ai
    tier: 2
    requires: [ml-basics]
    courses: [d2l, hung-yi-lee-ml]
    rule: any
    description: 亲手搭起神经网络。
  - id: generative-ai
    title: 生成式奥义
    subject: ai
    tier: 3
    cost: 2
    requires: [deep-learning]
    courses: [hung-yi-lee-ml, diffusion-models]
    rule: any
    description: Transformer 与 Diffusion 的炼成术。
  - id: computer-vision
    title: 视觉之眼
    subject: ai
    tier: 3
    cost: 2
    requires: [deep-learning]
    courses: [cs231n, eecs-498, cmu-16-385]
    rule: any
    description: 让机器看见世界。
  - id: nlp
    title: 语言之灵
    subject: ai
    tier: 3
    cost: 2
    requires: [deep-learning]
    courses: [cs224n]
    rule: any
    description: 从词向量到大语言模型。
  - id: reinforcement-learning
    title: 决策之道
    subject: ai
    tier: 3
    cost: 2
    requires: [deep-learning]
    courses: [cs285]
    rule: any
    description: 在试错中学会最优策略。
  - id: large-models
    title: 大模型炼成
    subject: ai
    tier: 3
    cost: 2
    requires: [deep-learning]
    courses: [cs336, mit-6-5940]
    rule: any
    description: 从零训练与高效部署——大模型时代的核心手艺。
  - id: neural-computation
    title: 神经之谜
    subject: ai
    tier: 2
    requires: [ml-basics]
    courses: [mit-9-40]
    rule: any
    description: 从真实神经元的电活动反推计算原理——人工网络的源头。
  - id: graph-learning
    title: 图之网络
    subject: ai
    tier: 3
    cost: 2
    requires: [deep-learning]
    courses: [cs224w]
    rule: any
    description: 在关系而非样本上学习——社交网络与分子皆是图。
  - id: speech-processing
    title: 声之解析
    subject: ai
    tier: 3
    cost: 2
    requires: [deep-learning]
    courses: [cs224s]
    rule: any
    description: 从声波到文字再到对话——让机器听懂人话。
  - id: computational-biology
    title: 生命之码
    subject: ai
    tier: 3
    cost: 2
    requires: [deep-learning]
    courses: [mit-6-874]
    rule: any
    description: 用深度学习解读基因组与蛋白质——生命本身就是一段代码。
  - id: ai-agents
    title: 智械之约
    subject: ai
    tier: 4
    cost: 3
    requires: [nlp]
    courses: [ai-agents]
    rule: any
    description: 让大模型使用工具、规划与协作——从回答者到行动者。


<meta charset="utf-8" />
<title>学者公会插件设置</title>
<style>
  body {
    max-width: 520px; margin: 40px auto; padding: 0 20px;
    font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif;
    background: #0b0e14; color: #e7e9f0;
  }
  h1 { font-size: 18px; color: #f5c542; }
  label { display: block; margin-top: 18px; font-size: 13px; color: #8b93a7; }
  input {
    width: 100%; margin-top: 6px; padding: 9px 11px; box-sizing: border-box;
    border: 1px solid #252d44; border-radius: 6px;
    background: #141a29; color: #e7e9f0; font-size: 13px;
  }
  input:focus { outline: none; border-color: #f5c542; }
  button {
    margin-top: 20px; padding: 9px 22px;
    border: 1px solid #f5c542; border-radius: 6px;
    background: transparent; color: #f5c542; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #f5c542; color: #0b0e14; }
  .hint { margin-top: 8px; font-size: 12px; color: #8b93a7; }
  .ok { color: #34d399; }
  .err { color: #f87171; }
</style>

<h1>🏰 学者公会 · 插件设置</h1>
<p class="hint">
  在 bilibili / YouTube 原站看课时自动同步进度到你自己搭的 Guild 站点。
</p>

<label>
  站点地址
  <input id="baseUrl" placeholder="http://localhost:3000" />
</label>
<p class="hint">自托管地址，末尾不用加斜杠。</p>

<label>
  访问 token
  <input id="token" type="password" placeholder="guild_xxxxxxxx" />
</label>
<p class="hint">在站点的「设置 → 浏览器插件 token」里生成。</p>

<button id="save">保存并测试连接</button>
<p class="hint" id="msg"></p>

<script src="options.js"></script>

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在 .env 中设置 SITE_DOMAIN，例如 bixuetang.com}
    command: >
      caddy reverse-proxy
      --from ${SITE_DOMAIN}
      --to bixuetang:3000
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bixuetang
    restart: unless-stopped

  bixuetang:
    # 镜像由 GitHub Actions 在 master push 时构建并推到 GHCR，服务器只 pull 不 build。
    # 想本地自行构建：BIXUETANG_IMAGE 留空并临时改回 `build: .`，或 `docker compose build`。
    image: ${BIXUETANG_IMAGE:-ghcr.io/zzxzzk115/bixuetang:latest}
    expose:
      - "3000"
    volumes:
      - bixuetang-data:/data
    environment:
      COOKIE_SECURE: "1"
      # 管理端(/admin)权限:逗号分隔的用户 id。从服务器环境或 .env 注入,
      # 留空则退回默认(id=1)。查自己的 id:见 README「管理员」一节。
      ADMIN_USER_IDS: "${ADMIN_USER_IDS:-}"
    restart: unless-stopped

volumes:
  bixuetang-data:
  caddy-data:
  caddy-config:

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在 .env 中设置 SITE_DOMAIN，例如 bixuetang.com}
    # 主域 + admin. 子域两个 vhost,见仓库根的 Caddyfile(镜像默认 CMD 会加载它)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bixuetang
    restart: unless-stopped

  bixuetang:
    # 镜像由 GitHub Actions 在 master push 时构建并推到 GHCR，服务器只 pull 不 build。
    # 想本地自行构建：BIXUETANG_IMAGE 留空并临时改回 `build: .`，或 `docker compose build`。
    image: ${BIXUETANG_IMAGE:-ghcr.io/zzxzzk115/bixuetang:latest}
    expose:
      - "3000"
    volumes:
      - bixuetang-data:/data
    environment:
      COOKIE_SECURE: "1"
      # 管理端(admin. 子域)默认账户 admin 的初始密码。留空则首启用弱口令
      # "admin" 并强制首登修改。见 README「管理端」一节。
      ADMIN_INITIAL_PASSWORD: "${ADMIN_INITIAL_PASSWORD:-}"
      # 学习提醒 Web Push:一次性生成密钥对(node -e "console.log(require('web-push').generateVAPIDKeys())"),
      # 填进 .env 即启用;留空则推送功能自动关闭。回访提醒靠 `pnpm push:reminders`(挂 cron)。
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:admin@bixuetang.com}"
      # 邮件重置链接的 SMTP(可选,见 src/lib/mail.ts)
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    restart: unless-stopped

volumes:
  bixuetang-data:
  caddy-data:
  caddy-config:

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在 .env 中设置 SITE_DOMAIN，例如 bixuetang.com}
    command: >
      caddy reverse-proxy
      --from ${SITE_DOMAIN}
      --to bixuetang:3000
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bixuetang
    restart: unless-stopped

  bixuetang:
    build: .
    expose:
      - "3000"
    volumes:
      - bixuetang-data:/data
    environment:
      COOKIE_SECURE: "1"
    restart: unless-stopped

volumes:
  bixuetang-data:
  caddy-data:
  caddy-config:

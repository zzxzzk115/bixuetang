services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在 .env 中设置 SITE_DOMAIN，例如 bixuetang.com}
    # 主域 + admin. 子域两个 vhost,见仓库根的 Caddyfile(镜像默认 CMD 会加载它)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bixuetang
    restart: unless-stopped

  bixuetang:
    # 镜像由 GitHub Actions 在 master push 时构建并推到 GHCR，服务器只 pull 不 build。
    # 想本地自行构建：BIXUETANG_IMAGE 留空并临时改回 `build: .`，或 `docker compose build`。
    image: ${BIXUETANG_IMAGE:-ghcr.io/zzxzzk115/bixuetang:latest}
    expose:
      - "3000"
    volumes:
      - bixuetang-data:/data
    environment:
      COOKIE_SECURE: "1"
      # 管理端(admin. 子域)默认账户 admin 的初始密码。留空则首启用弱口令
      # "admin" 并强制首登修改。见 README「管理端」一节。
      ADMIN_INITIAL_PASSWORD: "${ADMIN_INITIAL_PASSWORD:-}"
    restart: unless-stopped

volumes:
  bixuetang-data:
  caddy-data:
  caddy-config:

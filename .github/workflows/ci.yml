name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 不用 npm ci：Windows 上生成的 lock 会缺可选依赖的嵌套包（npm/cli#4828）
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run validate

  # PR / dev 上构建并冒烟测试，尽早发现镜像坏掉；
  # master 的构建交给 release（构建+推送一次搞定，不重复 build）。
  docker-smoke:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t guild:ci .
      - name: Smoke test container
        run: |
          docker run -d --name guild -p 3000:3000 guild:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then echo OK; exit 0; fi
            sleep 2
          done
          docker logs guild
          exit 1

  # 只有 master push 且 check 通过，才构建镜像并推 GHCR，供服务器免 build 拉取部署。
  release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # github.repository = zzxzzk115/bixuetang（全小写，符合 GHCR 要求）
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
